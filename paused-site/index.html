<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>الموقع متوقف مؤقتاً</title>
    <style>
      :root { color-scheme: light dark; }
      html, body {
        height: 100%;
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
        background: #0b0b0f;
        color: #f5f5f7;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
      }
      .card {
        max-width: 32rem;
        padding: 2.5rem 2rem;
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      h1 { font-size: 1.75rem; margin: 0 0 0.75rem; }
      p  { margin: 0.5rem 0; line-height: 1.7; opacity: 0.85; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>الموقع متوقف مؤقتاً</h1>
      <p>تم إيقاف هذا المشروع مؤقتاً من قبل المالك.</p>
      <p>يرجى المحاولة لاحقاً.</p>
    </main>
  </body>
</html>
